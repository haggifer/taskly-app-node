name: Unit test agent (reusable run)

# Runs the custom unit-test agent with read-only permissions, then verifies its commit on a fresh runner.
# Callers publish the result; nothing here can write to the repository.
on:
  workflow_call:
    inputs:
      mode:
        description: "pr or backfill"
        type: string
        required: true
      checkout-ref:
        description: Commit the agent starts from
        type: string
        required: true
      base-sha:
        description: Pull request base commit (PR mode)
        type: string
        default: ""
      app:
        description: Application to backfill (backfill mode)
        type: string
        default: ""
      max-files:
        description: Most source files to cover (backfill mode)
        type: string
        default: "8"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
    outputs:
      agent-outcome:
        description: success or failure of the agent step
        value: ${{ jobs.agent.outputs.outcome }}

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.326"

jobs:
  agent:
    name: Run the unit-test agent
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      outcome: ${{ steps.agent.outcome }}
    steps:
      - name: Set the run directory
        run: echo "RUN_DIR=$RUNNER_TEMP/test-agent" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies without lifecycle scripts
        run: |
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          (cd backend && npx --no-install prisma generate)
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Prepare the agent's inputs
        id: prepare
        env:
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ inputs.base-sha }}
          APP: ${{ inputs.app }}
          MAX_FILES: ${{ inputs.max-files }}
        run: |
          mkdir -p "$RUN_DIR"
          CHANGES=()
          if [ "$MODE" = "pr" ]; then
            node .github/test-agent/collect-changes.mjs --base "$BASE_SHA" --head HEAD --out "$RUN_DIR/changes.json"
            CHANGES=(--changes "$RUN_DIR/changes.json")
          fi
          for app in backend frontend; do
            node .github/test-agent/run-tests.mjs --app "$app" "${CHANGES[@]}" --out "$RUN_DIR/baseline/$app" || true
          done
          if [ "$MODE" = "backfill" ]; then
            node .github/test-agent/select-targets.mjs --baseline "$RUN_DIR/baseline" --app "$APP" \
              --max "$MAX_FILES" --out "$RUN_DIR/targets.json"
          fi
          echo "start-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name "unit-test-agent"
          git config user.email "unit-test-agent@users.noreply.github.com"

      - name: Install Claude Code
        run: npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      # Claude Code's sandbox runs the agent's commands with their own PID and network namespaces and limited writes.
      # Ubuntu 24.04 restricts the unprivileged user namespaces bubblewrap needs; lifting that is safe because this
      # runner VM exists for one job. Hosted runners can't nest user namespaces, so the sandbox's seccomp layer
      # (which only blocks Unix sockets) is off; Docker is stopped so its socket can't be used to leave the sandbox.
      - name: Install the sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
          sudo systemctl stop docker.socket docker.service containerd.service
          sudo systemctl mask docker.socket docker.service containerd.service
          for socket in /var/run/docker.sock /run/containerd/containerd.sock; do
            if timeout 2 socat -u OPEN:/dev/null "UNIX-CONNECT:$socket" 2>/dev/null; then
              echo "::error::$socket still accepts connections"; exit 1
            fi
          done
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid --unshare-net true
          echo "bubblewrap works; Docker is stopped"

      - name: Write the task prompt
        env:
          MODE: ${{ inputs.mode }}
          APP: ${{ inputs.app }}
        run: |
          if [ "$MODE" = "pr" ]; then
            cat > "$RUN_DIR/prompt.md" <<EOF
          Work in **PR mode**. Run directory: \`$RUN_DIR\`.

          - \`$RUN_DIR/changes.json\` is the change manifest. The checkout is the pull request's head.
          - \`$RUN_DIR/baseline/<app>/result.json\` is the existing suite before your changes.

          Decide from the code alone. Follow your process: analyze every changed file, write or update tests where
          needed, verify them, commit them with the message \`test: add unit tests for <short scope> [unit-test-agent]\`,
          and write the report to \`$RUN_DIR/report.md\`.
          EOF
          else
            cat > "$RUN_DIR/prompt.md" <<EOF
          Work in **backfill mode** on the \`$APP\` application. Run directory: \`$RUN_DIR\`.

          - \`$RUN_DIR/targets.json\` lists the source files to cover, least covered first.
          - \`$RUN_DIR/baseline/<app>/result.json\` is the existing suite before your changes.

          Take the targets in order and decide \`write\`, \`update\` or \`skip-not-testable\` for each. Aim for meaningful
          assertions on each file's public behavior, covering its branches and error paths. Verify every test file,
          then run the whole \`$APP\` suite once with \`--targets\` set to all target files for the before/after
          coverage. Commit with the message \`test($APP): backfill unit tests [unit-test-agent]\` and write the report
          to \`$RUN_DIR/report.md\`, starting with a \`# $APP: backfill unit tests for <short scope>\` line and including
          a before/after coverage table per target file.
          EOF
          fi

      - name: Run the agent
        id: agent
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
          TEST_AGENT_RUN_DIR: ${{ runner.temp }}/test-agent
        # The sandbox allows Unix sockets (no seccomp layer on hosted runners), so every socket that exists before the
        # agent starts is hidden from it: systemd, D-Bus, snapd, Docker, and the runner's .NET diagnostic sockets.
        run: |
          {
            sudo find /run -type s 2>/dev/null | while read -r socket; do
              dir=$(dirname "$socket")
              if [ "$dir" = "/run" ]; then echo "$socket"; else echo "$dir"; fi
            done
            find /tmp -maxdepth 2 -type s 2>/dev/null
          } | sort -u > "$RUNNER_TEMP/hidden-sockets.txt"
          SETTINGS="$RUNNER_TEMP/claude-settings.json"
          node -e '
            const fs = require("fs")
            const settings = JSON.parse(fs.readFileSync(".github/test-agent/claude-settings.json", "utf8"))
            const hidden = fs.readFileSync(process.argv[1], "utf8").split(/\r?\n/).filter(Boolean)
            settings.sandbox.filesystem = { ...settings.sandbox.filesystem, denyRead: hidden }
            fs.writeFileSync(process.argv[2], JSON.stringify(settings, null, 2))
            console.log(`Hiding ${hidden.length} socket paths from the sandbox.`)' "$RUNNER_TEMP/hidden-sockets.txt" "$SETTINGS"
          ALLOWED_TOOLS=$(node -p "require(process.argv[1]).permissions.allow.join(',')" "$SETTINGS")
          claude -p "$(cat "$RUN_DIR/prompt.md")" \
            --agent unit-test-agent \
            --settings "$SETTINGS" \
            --add-dir "$RUN_DIR" \
            --tools Read,Glob,Grep,Edit,Write,Bash,Skill \
            --allowedTools "$ALLOWED_TOOLS" \
            --disallowedTools WebFetch,WebSearch \
            --permission-mode dontAsk \
            --max-turns 120 \
            --output-format stream-json --verbose > "$RUNNER_TEMP/test-agent-transcript.jsonl"

      # Built after the agent exits, in a directory it never had access to, so nothing it planted is shipped.
      - name: Package the agent's output
        if: always()
        env:
          START_SHA: ${{ steps.prepare.outputs.start-sha }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          PKG="$RUNNER_TEMP/test-agent-package"
          rm -rf "$PKG" && mkdir -p "$PKG"
          if [ -n "$(git rev-list "$START_SHA..HEAD")" ]; then
            git format-patch --stdout "$START_SHA..HEAD" > "$PKG/agent.patch"
            git diff --stat "$START_SHA" HEAD >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUN_DIR/report.md" ]; then
            head -c 60000 "$RUN_DIR/report.md" > "$PKG/report.md"
          else
            printf '### Agent report: none\n\nThe agent stopped before writing its report (agent step: %s). See the workflow run.\n' \
              "$AGENT_OUTCOME" > "$PKG/report.md"
          fi
          cp "$RUNNER_TEMP/test-agent-transcript.jsonl" "$PKG/transcript.jsonl" 2>/dev/null || true

      # The agent process holds the token; a prompt-injected agent could try to smuggle it into its output.
      - name: Refuse output that contains a credential
        if: always()
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PKG="$RUNNER_TEMP/test-agent-package"
          LEAKED=false
          for file in "$PKG"/*; do
            [ -f "$file" ] || continue
            if { [ -n "$TOKEN" ] && grep -qF -- "$TOKEN" "$file"; } || grep -qE 'sk-ant-[A-Za-z0-9_-]{16,}' "$file"; then
              LEAKED=true
            fi
          done
          if [ "$LEAKED" = "true" ]; then
            rm -f "$PKG"/*
            printf '### Agent report: withheld\n\nThe agent output contained a credential-shaped string, so nothing from this run is published.\n' > "$PKG/report.md"
            echo "::error::The agent output contained a credential-shaped string and was discarded."
            exit 1
          fi

      - name: Upload the agent's output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-agent-output
          path: ${{ runner.temp }}/test-agent-package/
          retention-days: 14

  gate:
    name: Verify the agent's tests (deterministic gate)
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the commit the agent started from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          path: test-agent-workspace
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download the agent's output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-agent-output
          path: ${{ runner.temp }}/agent-output
      - uses: ./test-agent-workspace/.github/actions/test-agent-gate
        with:
          base-sha: ${{ inputs.base-sha }}
          patch-dir: ${{ runner.temp }}/agent-output
          workspace: test-agent-workspace
