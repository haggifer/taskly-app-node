name: Unit Test Agent report

# Posts the deterministic gate's results on the pull request after each agent run. It runs in the base repository's
# context, never checks out pull request code, and treats the downloaded artifact as untrusted text.
on:
  workflow_run:
    workflows: ["Unit Test Agent"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  report:
    name: Post the verified results
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the gate results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: test-agent-verification
          path: verification
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Create or update the verified-results comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          MARKER='<!-- unit-test-agent:verified-results -->'
          {
            echo "$MARKER"
            echo "### ✅ Unit test agent: verified results"
            echo
            echo "Deterministic gate on commit \`${HEAD_SHA:0:7}\` ([workflow run]($RUN_URL), conclusion: \`$CONCLUSION\`)."
            echo "These numbers come from re-running every suite on a fresh runner, not from the agent."
            echo
            if [ -f verification/summary.md ]; then
              head -c 60000 verification/summary.md
            else
              echo "➖ The gate did not run: the agent produced nothing to publish, or the run stopped earlier. See the workflow run."
            fi
          } > comment.md

          COMMENT_ID=$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id" | tail -n 1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$COMMENT_ID" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi
