name: Sandbox probe (temporary)

on:
  push:
    branches: [probe/sandbox]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        host: [apparmor-profile, sysctl]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm ci --prefix backend --ignore-scripts --no-audit --no-fund
          (cd backend && npx --no-install prisma generate)
          npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@2.1.326"
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          echo "restriction before: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
      - name: Prepare the host (${{ matrix.host }})
        run: |
          if [ "${{ matrix.host }}" = "sysctl" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '  include if exists <local/bwrap>' '}' \
              | sudo tee /etc/apparmor.d/bwrap > /dev/null
            sudo systemctl reload apparmor
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-net true && echo "single bwrap: ok" || echo "single bwrap: FAILED"
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-net bwrap --ro-bind / / --dev /dev --unshare-user true && echo "nested bwrap: ok" || echo "nested bwrap: FAILED"
      - name: Run three commands through the Claude Code sandbox
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          DISABLE_AUTOUPDATER: "1"
        run: |
          RUN_DIR="$RUNNER_TEMP/test-agent"; mkdir -p "$RUN_DIR/verify"
          node -e '
            const s = require("./.github/test-agent/claude-settings.json")
            s.permissions.allow.push("Bash(node probe/proc-environ.mjs)")
            require("fs").writeFileSync(process.argv[1], JSON.stringify(s))' "$RUNNER_TEMP/probe-settings.json"
          ALLOWED=$(node -p "require(process.argv[1]).permissions.allow.join(',')" "$RUNNER_TEMP/probe-settings.json")
          TEST_AGENT_RUN_DIR="$RUN_DIR" claude -p "This is an infrastructure probe. Run exactly these three shell commands, one at a time, and print each command's complete output verbatim, then stop. 1) git status --short  2) node .github/test-agent/run-tests.mjs --app backend --tests tests/router.test.ts --out $RUN_DIR/verify/probe  3) node probe/proc-environ.mjs" \
            --settings "$RUNNER_TEMP/probe-settings.json" --add-dir "$RUN_DIR" \
            --tools Bash --allowedTools "$ALLOWED" --permission-mode dontAsk --max-turns 8 \
            --output-format json > "$RUNNER_TEMP/probe.json" || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
            console.log(r.result)
            console.log("denials:", JSON.stringify(r.permission_denials ?? []))' "$RUNNER_TEMP/probe.json"
